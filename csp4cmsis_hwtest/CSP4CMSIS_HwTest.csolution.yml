# CSP4CMSIS 2.0 regression suite on the DK-E8 (hardware test plan, stage 1).
# The FVP suite (CSP4CMSIS tests/fvp_sse300/bc_tests.cpp) ported to RTSS-HP.
# Build and run with ./hwtest.sh, which selects the library under test and
# records its commit (see README.md in this directory).
solution:
  created-for: CMSIS-Toolbox@2.14.1
  cdefault: # use the cdefault.yml next to this file

  # Default toolchain; hwtest.sh passes --toolchain AC6 or GCC explicitly.
  compiler: GCC
  select-compiler:
    - compiler: GCC
    - compiler: AC6

  packs:
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::CMSIS-FreeRTOS@^11.3.0
    - pack: ARM::CMSIS-RTX@^5.9.1

  target-types:
    - type: DevKit-E8
      board: DevKit-E8
      device: AE822FA0E5597LS0

  # One build type per CMSIS-RTOS2 backend, plus the heap-free variants, as in
  # the FVP harness. No optimize: key: the compiler default (-O0) is kept.
  build-types:
    - type: RTX5
      define:
        - CSP4CMSIS_RTOS2_BACKEND_RTX5
    - type: FreeRTOS
      define:
        - CSP4CMSIS_RTOS2_BACKEND_FREERTOS
    # Heap-free proof: RTOS dynamic allocation disabled (see the FVP README,
    # "Heap-free proof").
    - type: RTX5-NoHeap
      define:
        - CSP4CMSIS_RTOS2_BACKEND_RTX5
        - OS_DYNAMIC_MEM_SIZE: 0
        # Arm C library stream mutexes (rtx_lib.c _mutex_initialize()) come
        # from RTX5's static mutex pool instead of dynamic memory.
        - OS_MUTEX_OBJ_MEM: 1
        - OS_MUTEX_NUM: 8
    - type: FreeRTOS-NoHeap
      define:
        - CSP4CMSIS_RTOS2_BACKEND_FREERTOS
        - configSUPPORT_DYNAMIC_ALLOCATION: 0
      misc:
        # CMSIS-FreeRTOS 11.3.0 clib_os.c workaround (see noheap_shim.h).
        - C-CPP:
            - -include $ProjectDir()$/noheap_shim.h

    # Hardware-only checks (M55_HP/hw_checks.inc): T16a cycle-step sweep on
    # v1.0.0, putFromISR() cost and interrupt latency on 2.0.
    - type: RTX5-HwCheck
      define:
        - CSP4CMSIS_RTOS2_BACKEND_RTX5
        - HWTEST_CHECKS
        - CSP4CMSIS_ISR_MAX_ELEMENT_SIZE: 1024   # latency of a 1024-byte masked copy
    - type: RTX5-HwCheck-O2
      define:
        - CSP4CMSIS_RTOS2_BACKEND_RTX5
        - HWTEST_CHECKS
        - CSP4CMSIS_ISR_MAX_ELEMENT_SIZE: 1024
      misc:
        - C-CPP:
            - -O2
    # Optimised builds of the suite (flag passed verbatim, as in the FVP harness).
    - type: RTX5-O2
      define:
        - CSP4CMSIS_RTOS2_BACKEND_RTX5
      misc:
        - C-CPP:
            - -O2
    - type: RTX5-Os
      define:
        - CSP4CMSIS_RTOS2_BACKEND_RTX5
      misc:
        - C-CPP:
            - -Os
    - type: FreeRTOS-O2
      define:
        - CSP4CMSIS_RTOS2_BACKEND_FREERTOS
      misc:
        - C-CPP:
            - -O2
    - type: FreeRTOS-Os
      define:
        - CSP4CMSIS_RTOS2_BACKEND_FREERTOS
      misc:
        - C-CPP:
            - -Os
    # Soak: the suite, restarted by NVIC_SystemReset() after every SUMMARY.
    - type: RTX5-Soak
      define:
        - CSP4CMSIS_RTOS2_BACKEND_RTX5
        - HWTEST_SOAK

  output-dirs:
    outdir: ./out/$TargetType$/$BuildType$/$Compiler$/

  projects:
    - project: M55_HP/M55_HP.cproject.yml
